# Build settings
# The github-pages gem silently defaults to `jekyll-theme-primer` (and ships
# its stylesheet to assets/css/style.css) whenever no theme is set. Setting
# this explicitly to null disables that fallback. See:
# https://github.com/github/pages-gem/issues/613
theme: null
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - assets/css/input.css
  # ruby/setup-ruby's bundler-cache installs gems into ./vendor/bundle inside
  # the repo on CI; without this, Jekyll scans the jekyll gem's own bundled
  # sample post template and fails on its unrendered ERB date placeholder.
  - vendor
  - .bundle
