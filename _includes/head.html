<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:,">

<!-- Self-hosted (no more fonts.googleapis.com/fonts.gstatic.com round trips).
     Preloaded because it's used by the above-the-fold hero heading, so the
     fetch starts immediately instead of waiting on style.css to be parsed. -->
<link rel="preload" href="{{ '/assets/fonts/inter-var-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

<!-- Compiled Tailwind CSS (built via `npm run build:css`, see package.json) -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

{% seo %}

<!-- Structured data so search engines / AI tools can parse who this is without guessing -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.author | jsonify }},
  "jobTitle": {{ site.hero.role | jsonify }},
  "url": {{ site.url | jsonify }},
  "description": {{ site.description | jsonify }}
  {%- assign profiles = "" | split: "," -%}
  {%- if site.github_username != "" -%}
    {%- assign github_url = "https://github.com/" | append: site.github_username -%}
    {%- assign profiles = profiles | push: github_url -%}
  {%- endif -%}
  {%- if site.linkedin_url != "" -%}{%- assign profiles = profiles | push: site.linkedin_url -%}{%- endif -%}
  {%- if profiles.size > 0 -%}
  ,"sameAs": {{ profiles | jsonify }}
  {%- endif -%}
}
</script>
