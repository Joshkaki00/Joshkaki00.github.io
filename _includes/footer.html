<footer class="border-t border-ink-900/10 py-10">
  <div class="mx-auto flex max-w-5xl flex-col items-center justify-between gap-4 px-6 text-sm text-ink-500 sm:flex-row">
    <p class="min-w-0">&copy; {{ site.time | date: '%Y' }} {{ site.author }}. All rights reserved.</p>
    <div class="-my-2 flex shrink-0 items-center gap-3">
      {% if site.github_username != "" %}
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener" class="inline-flex items-center px-1 py-2 transition hover:text-ink-900">GitHub</a>
      {% endif %}
      {% if site.linkedin_url != "" %}
      <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener" class="inline-flex items-center px-1 py-2 transition hover:text-ink-900">LinkedIn</a>
      {% endif %}
      {% if site.email != "" %}
      <a href="mailto:{{ site.email }}" class="inline-flex items-center px-1 py-2 transition hover:text-ink-900">Email</a>
      {% endif %}
    </div>
  </div>
</footer>
